<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#102b60">
  <title>Login — Prantik Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Borel&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: #beddf1;
    }

    body {
      position: relative;
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      color: #17293b;
      background:
        radial-gradient(ellipse at 8% 8%, rgba(229, 243, 251, .94) 0%, rgba(218, 238, 248, .66) 25%, transparent 51%),
        radial-gradient(ellipse at 91% 9%, rgba(171, 205, 230, .72) 0%, rgba(200, 224, 240, .42) 30%, transparent 58%),
        radial-gradient(ellipse at 88% 88%, rgba(210, 197, 235, .42) 0%, rgba(226, 217, 243, .2) 34%, transparent 61%),
        radial-gradient(ellipse at 12% 86%, rgba(174, 222, 220, .4) 0%, rgba(207, 238, 235, .2) 33%, transparent 59%),
        radial-gradient(ellipse at 52% 48%, rgba(223, 239, 248, .58) 0%, rgba(184, 211, 228, .24) 38%, transparent 67%),
        linear-gradient(135deg, #f1f8fc 0%, #d8eaf5 48%, #c2dced 100%);
      background-attachment: scroll;
      background-size: cover;
      font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    button,
    input { font: inherit; }

    .login-main {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100svh;
      display: grid;
      grid-template-rows: minmax(auto, 1fr) auto;
      place-items: center;
      row-gap: 18px;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    }

.login-card {
      position: relative;
      z-index: 2;
      container-type: inline-size;
      width: 100%;
      margin: 0 auto;
      padding: 24px 18px 18px;
      border: 1.5px solid transparent;
      border-radius: 27px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .8), rgba(238, 247, 253, .68)) padding-box,
        linear-gradient(145deg, rgba(255, 255, 255, .98) 0%, rgba(255, 255, 255, .62) 48%, rgba(91, 132, 164, .42) 100%) border-box;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .98),
        inset 1px 0 0 rgba(255, 255, 255, .52),
        inset 0 -1px 0 rgba(66, 98, 125, .13),
        0 14px 32px rgba(27, 61, 91, .17),
        0 30px 62px rgba(25, 57, 88, .14);
      -webkit-backdrop-filter: blur(30px) saturate(145%);
      backdrop-filter: blur(30px) saturate(145%);
    }

    .login-card.recovery-mode {
      height: var(--login-card-fixed-height);
      overflow: hidden;
    }

    .login-stack {
      position: relative;
      grid-row: 1;
      align-self: center;
      width: min(calc(100% - 14px), 365px);
    }

    .powered-by {
      position: relative;
      grid-row: 2;
      align-self: end;
      z-index: 3;
      top: auto;
      bottom: auto;
      left: auto;
      width: max-content;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, .86);
      border-radius: 999px;
      color: rgba(29, 52, 72, .58);
      background: rgba(248, 252, 255, .84);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .94), 0 5px 14px rgba(37, 72, 101, .06);
      font-size: 15px;
      line-height: 1;
      transform: none;
    }

    .powered-by img {
      display: block;
      width: 58px;
      height: auto;
    }

    .powered-by > span {
      font-size: 14px;
    }

    .powered-by a {
      display: inline-flex;
      align-items: center;
    }

    .login-card h2 {
      position: relative;
      top: 5px;
      margin: 0 0 5px;
      text-align: center;
      font-size: 24px;
    }

    .login-card > h2 + p {
      position: relative;
      top: 5px;
    }

    .welcome-title {
      grid-area: 1 / 1;
      width: 100%;
      font-family: "Borel", cursive;
      font-weight: 400;
      line-height: 1;
      text-align: center;
    }

    .welcome-period { color: #ef3349; }

    .welcome-slot {
      position: relative;
      display: grid;
      place-items: center;
    }

    .login-card.has-login-error .welcome-title {
      visibility: hidden;
    }

    .login-card.has-login-error {
      height: var(--login-card-error-height);
    }


    .welcome-subspace {
      width: max-content;
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border-radius: 8px;
      color: #a31320;
      background: #ffe0e3;
      box-shadow: inset 0 0 0 1px rgba(214, 39, 55, .28);
      font-size: 12px;
      line-height: 1.25;
      opacity: 0;
      visibility: hidden;
      transform: scale(.98);
      transition: opacity .26s ease, transform .26s cubic-bezier(.22, .8, .3, 1), visibility 0s linear .26s;
    }

    .login-card.login-card > .welcome-subspace {
      width: max-content;
      max-width: 100%;
      margin-top: -16px;
      margin-left: auto;
      margin-right: auto;
    }

    .welcome-subspace.is-error {
      color: #8f101b;
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      transition-delay: 0s;
    }

    .welcome-slot > .welcome-subspace {
      position: relative;
      grid-area: 1 / 1;
      margin: 0;
      justify-self: center;
      align-self: center;
      transform: scale(.98);
      pointer-events: none;
    }

    .welcome-slot > .welcome-subspace.is-error {
      transform: scale(1);
    }

    .welcome-emoji {
      position: relative;
      width: 112px;
      height: 112px;
      margin: 0 auto 8px;
      display: block;
      cursor: pointer;
      transition: scale .16s cubic-bezier(.22, .8, .3, 1);
      touch-action: manipulation;
    }

    .welcome-emoji:active,
    .recovery-emoji:active { scale: .965; }

    .welcome-emoji.is-changing {
      animation: emoji-change-scale .22s cubic-bezier(.22, .8, .3, 1);
    }

    .recovery-emoji.is-changing picture {
      transform-origin: 50% 50%;
      animation: recovery-emoji-change-scale .22s cubic-bezier(.22, .8, .3, 1);
    }

    @keyframes emoji-change-scale {
      0%, 100% { scale: 1; }
      45% { scale: .965; }
    }

    @keyframes recovery-emoji-change-scale {
      0%, 100% { transform: scale(1); }
      45% { transform: scale(.965); }
    }

    .welcome-emoji picture {
      position: absolute;
      inset: 0;
      opacity: 0;
    }

    .welcome-emoji .emoji-smile,
    .welcome-emoji.is-password-active .emoji-peek { opacity: 1; }
    .welcome-emoji.is-password-active .emoji-smile { opacity: 0; }
    .welcome-emoji.is-login-error .emoji-smile,
    .welcome-emoji.is-login-error .emoji-peek { opacity: 0; }
    .welcome-emoji.is-login-error .emoji-error { opacity: 1; }
    .welcome-emoji.is-dizzy .emoji-smile,
    .welcome-emoji.is-dizzy .emoji-peek,
    .welcome-emoji.is-dizzy .emoji-error { opacity: 0; }
    .welcome-emoji.is-dizzy .emoji-dizzy { opacity: 1; }

    .welcome-emoji img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-logo {
      height: 118px;
      margin: -12px -6px 25px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: linear-gradient(
        120deg,
        #52675f,
        #17666d,
        #285c86,
        #59417e,
        #823f55,
        #9a5837,
        #17666d,
        #52675f
      );
      background-size: 500% 500%;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .22),
        0 8px 18px rgba(17, 39, 53, .16);
      animation: logo-gradient-flow 14s ease-in-out infinite;
    }

    @keyframes logo-gradient-flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card-logo img {
      display: block;
      width: 156px;
      height: auto;
    }

    .login-card > p {
      margin: 0 0 25px;
      color: rgba(38, 58, 76, .62);
      text-align: center;
      font-size: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .field label {
      padding-left: 7px;
      color: rgba(20, 39, 55, .78);
      font-size: 13px;
      font-weight: 500;
    }

    .input-wrap {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 15px;
      border: 1px solid rgba(74, 108, 136, .25);
      border-radius: 12px;
      background: #eaf2f8;
      box-shadow: inset 0 1px 2px rgba(30, 62, 88, .06);
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    .input-wrap:focus-within {
      border-color: #3974c9;
      background: #f5f9fc;
      box-shadow: 0 0 0 3px rgba(50, 106, 194, .13);
    }

    .input-wrap:has(input[aria-invalid="true"]) {
      border-color: #df5360;
      background: #fff0f1;
      box-shadow: inset 0 0 0 1px rgba(218, 48, 63, .08);
    }

    .input-wrap:has(input[aria-invalid="true"]):focus-within {
      border-color: #d93646;
      background: #fff5f5;
      box-shadow: 0 0 0 3px rgba(217, 54, 70, .12);
    }

    .input-wrap svg {
      flex: 0 0 auto;
      width: 21px;
      height: 21px;
      fill: none;
      stroke: #315781;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .72;
    }

    .input-wrap input {
      width: 100%;
      min-width: 0;
      height: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      color: #15283b;
      background: transparent;
      font-size: 16px;
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    .input-wrap input::placeholder { color: rgba(48, 70, 88, .42); }

    .password-toggle {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      margin-right: -7px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #315781;
      background: transparent;
      cursor: pointer;
    }

    .password-toggle svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      opacity: .72;
    }

    .password-toggle .eye-hidden,
    .password-toggle[aria-pressed="true"] .eye-visible { display: none; }
    .password-toggle[aria-pressed="true"] .eye-hidden { display: block; }
    .password-toggle:active { background: rgba(49, 87, 129, .1); }

    .login-button {
      position: relative;
      width: 100%;
      height: 48px;
      margin-top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(120deg, #3b78d4, #17458e);
      box-shadow: 0 9px 20px rgba(24, 68, 138, .27), inset 0 1px 0 rgba(255, 255, 255, .2);
      font-weight: 700;
      letter-spacing: normal;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .16s ease, filter .2s ease;
    }

    .login-button svg {
      position: static;
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .forgot-password {
      width: max-content;
      height: 56px;
      margin: 0 auto 0 7px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      color: #285fae;
      background: transparent;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      pointer-events: none;
    }

    .forgot-password span {
      pointer-events: auto;
      cursor: pointer;
    }

    .forgot-password:active { opacity: .62; }

    .login-button:active { transform: scale(.98); }
    .login-button:hover { filter: brightness(1.06); }

    .login-card > .login-note {
      margin: 18px 0 0;
      color: rgba(38, 58, 76, .48);
      text-align: center;
      font-size: 14px;
      line-height: 1.45;
    }

    .recovery-panel {
      display: none;
      width: 100%;
      min-height: 330px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }

    .login-card.recovery-mode > :not(.card-logo):not(.recovery-panel) {
      display: none;
    }

    .login-card.recovery-mode > .recovery-panel {
      display: flex;
    }

    .login-card.recovery-mode > .recovery-panel .recovery-card {
      animation: recovery-in .34s cubic-bezier(.22, .8, .3, 1) both;
    }

    .login-card.recovery-mode > .recovery-panel.recovery-leaving .recovery-card {
      animation: recovery-out .26s ease both;
    }

    .login-card.recovery-mode > .recovery-panel.recovery-leaving .recovery-emoji {
      animation: recovery-emoji-out .26s ease both;
    }

    .login-card.returning-to-login > :not(.card-logo):not(.recovery-panel) {
      animation: sign-in-return .32s cubic-bezier(.22, .8, .3, 1) both;
    }

    .recovery-emoji {
      position: relative;
      width: 112px;
      height: 112px;
      cursor: pointer;
      transition: scale .16s cubic-bezier(.22, .8, .3, 1);
      touch-action: manipulation;
    }

    .recovery-emoji picture {
      position: absolute;
      inset: 0;
      opacity: 1;
    }

    .recovery-emoji .emoji-dizzy { opacity: 0; }
    .recovery-emoji.is-dizzy picture { opacity: 0; }
    .recovery-emoji.is-dizzy .emoji-dizzy { opacity: 1; }

    .recovery-emoji img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .recovery-card {
      position: relative;
      width: 100%;
      min-height: 210px;
      padding: 52px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      border: 0;
      border-radius: 20px;
      background:
        radial-gradient(85% 52% at 4% 0%, rgba(202, 222, 255, .78) 0%, transparent 72%),
        radial-gradient(70% 48% at 53% 0%, rgba(218, 244, 225, .72) 0%, transparent 72%),
        radial-gradient(82% 54% at 100% 0%, rgba(255, 218, 211, .76) 0%, transparent 72%),
        #fff;
      box-shadow: 0 10px 24px rgba(34, 66, 94, .1);
    }

    .recovery-card p {
      max-width: 290px;
      margin: 0;
      color: #21374a;
      font-size: 17px;
      line-height: 1.25;
    }

    .recovery-card p strong {
      display: block;
      margin-top: 1px;
      color: #5b8ff0;
      font-size: 19px;
      font-weight: 700;
    }

    .recovery-stars {
      color: rgba(0, 0, 0, .35);
      font-size: 31px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 6px;
      white-space: nowrap;
    }

    .recovery-back-icon {
      position: absolute;
      top: 12px;
      left: 14px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #315781;
      background: transparent;
      cursor: pointer;
    }

    .recovery-back-icon svg {
      width: 27px;
      height: 27px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .recovery-back-icon:active { background: rgba(49, 87, 129, .1); }

    .recovery-back-link {
      width: min(100%, 240px);
      height: 44px;
      margin-top: 14px;
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: linear-gradient(120deg, #3b78d4, #17458e);
      box-shadow: 0 7px 16px rgba(24, 68, 138, .2), inset 0 1px 0 rgba(255, 255, 255, .2);
      font-weight: 700;
      cursor: pointer;
      transition: transform .16s ease, filter .2s ease;
    }

    .recovery-back-link:hover { filter: brightness(1.06); }
    .recovery-back-link:active { transform: scale(.98); }

    @keyframes recovery-in {
      from { opacity: 0; transform: scale(.985); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes recovery-out {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(.985); }
    }

    @keyframes recovery-emoji-out {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    @keyframes sign-in-return {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 899px) {
      html,
      body {
        width: 100%;
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: visible;
      }

      .login-main {
        height: auto;
        min-height: 100svh;
        overflow: visible;
        overscroll-behavior: auto;
        -webkit-overflow-scrolling: auto;
      }

      .login-card {
        transform: translateY(-28px);
      }

      .login-card > .credential-field {
        transform: translateY(14px);
      }

      .login-card.login-card > .welcome-subspace {
        margin-top: 0;
      }

      .welcome-emoji {
        width: 76px;
        height: 76px;
        margin-top: -6px;
        margin-bottom: 24px;
      }

      .login-card.login-card .welcome-title {
        transform: none;
      }

      .login-card > .welcome-slot {
        transform: translateY(-4px);
      }

      .login-card.recovery-mode {
        display: flex;
        flex-direction: column;
      }

      .login-card.recovery-mode > .card-logo {
        flex: 0 0 118px;
      }

      .login-card.login-card > .recovery-panel {
        flex: 1 1 auto;
        min-height: 0;
        gap: 26px;
      }

      .recovery-panel .recovery-emoji {
        width: 76px;
        height: 76px;
        flex: 0 0 76px;
      }

      .recovery-panel .recovery-card {
        width: calc(100% + 12px);
        min-height: 0;
        flex: 1 1 auto;
        margin: 0 -6px -6px;
        padding: 90px 20px 22px;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
      }

      .recovery-panel .recovery-card p {
        align-self: start;
      }

      .recovery-panel .recovery-stars {
        align-self: center;
        justify-self: center;
      }

      .recovery-panel .recovery-back-link {
        align-self: end;
        justify-self: center;
        margin: 0;
      }
    }

    @media (min-width: 900px) {
      body,
      .login-main {
        min-height: 100dvh;
      }

      body {
        background-attachment: fixed;
      }

      .login-main {
        padding: 40px;
      }

      .login-stack {
        width: min(calc(100% - 40px), 704px);
      }

      .login-card {
        display: grid;
        grid-template-columns: minmax(0, 300px) minmax(0, 360px);
        column-gap: 14px;
        align-items: center;
        padding: 14px;
        border-radius: 24px;
      }

      .welcome-emoji {
        width: 96px;
        height: 96px;
      }

      .login-card > :not(.card-logo) {
        position: relative;
        top: 24px;
        grid-column: 2;
        width: min(100%, 360px);
        justify-self: center;
      }

      .card-logo {
        grid-column: 1;
        grid-row: 1 / span 8;
        align-self: stretch;
        min-height: 410px;
        height: auto;
        margin: 0;
        border-radius: 10px;
      }

      .card-logo img {
        width: min(68%, 275px);
      }

      .login-card h2 {
        align-self: end;
        margin: 54px 0 7px;
        font-size: 32px;
        transform: translateY(-4px);
      }

      .login-card > .welcome-slot {
        top: 38px;
        min-height: 93px;
        margin-bottom: 12px;
      }

      .login-card > .welcome-slot .welcome-title {
        top: 0;
        margin: 0;
        transform: none;
      }

      .welcome-slot > .welcome-subspace {
        transform: translateY(16px) scale(.98);
      }

      .welcome-slot > .welcome-subspace.is-error {
        transform: translateY(16px) scale(1);
      }

      .recovery-panel .recovery-emoji {
        width: 96px;
        height: 96px;
      }

      .login-card > p {
        margin-bottom: 30px;
        font-size: 15px;
      }

      .login-card > h2 + p {
        transform: translateY(-14px);
      }

      .login-card.login-card > h2,
      .login-card.login-card > h2 + p {
        top: 50px;
      }

      .login-card.login-card > .welcome-emoji {
        top: 42px;
        margin-top: -34px;
        margin-bottom: -18px;
      }

      .login-card > .field {
        width: 100%;
        top: 32px;
      }

      .forgot-password {
        margin-left: 0;
        padding-left: 7px;
        justify-items: start;
      }

      .login-card > .login-note {
        align-self: start;
        margin: 20px 8px 36px;
      }

      .login-card.login-card > .recovery-panel {
        position: relative;
        top: 0;
        grid-column: 2;
        grid-row: 1;
        width: min(100%, 360px);
        height: 100%;
        min-height: 410px;
        align-self: center;
        justify-self: center;
      }

      .login-card.recovery-mode > .card-logo {
        grid-row: 1;
      }

      .recovery-panel .recovery-emoji {
        position: absolute;
        z-index: 2;
        top: 8px;
        left: 50%;
        margin: 0;
        transform: translateX(-50%);
      }

      .recovery-panel .recovery-card {
        position: absolute;
        top: 138px;
        right: 0;
        bottom: 0;
        left: 0;
        min-height: 0;
        border-radius: 10px;
      }

      .recovery-panel .recovery-card p {
        position: absolute;
        top: calc(50% - 69px);
        left: 50%;
        width: calc(100% - 38px);
        transform: translate(-50%, -50%);
      }

      .recovery-panel .recovery-back-link {
        position: absolute;
        right: auto;
        bottom: 26px;
        left: 50%;
        margin: 0;
        transform: translateX(-50%);
      }

      .recovery-panel .recovery-stars {
        position: absolute;
        top: 58%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .recovery-panel .recovery-back-link:active {
        transform: translateX(-50%) scale(.98);
      }
    }

    @media (max-width: 380px) {
      .login-main { padding-inline: 14px; }
      .login-card { padding: 25px 18px 18px; border-radius: 25px; }
      .login-card h2 { font-size: 23px; }
      .input-wrap,
      .login-button { height: 48px; }
    }
  </style>
</head>
<body>
  <main class="login-main">
    <div class="login-stack">
      <form class="login-card" id="login-form">
      <div class="card-logo">
        <img src="https://ik.imagekit.io/d3ycnoiwd/PrantikWebsite/logo.png" alt="Prantik Photography">
      </div>
      <div class="welcome-emoji" role="button" tabindex="0" aria-label="Change emoji temporarily" aria-live="off">
        <picture class="emoji-smile">
          <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f600/512.webp" type="image/webp">
          <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f600/512.gif" alt="Smiling face">
        </picture>
        <picture class="emoji-peek">
          <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1fae3/512.webp" type="image/webp">
          <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1fae3/512.gif" alt="Peeking face">
        </picture>
        <picture class="emoji-error">
          <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f629/512.webp" type="image/webp">
          <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f629/512.gif" alt="Distressed face">
        </picture>
        <picture class="emoji-dizzy">
          <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f635/512.webp" type="image/webp">
          <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f635/512.gif" alt="Dizzy face">
        </picture>
      </div>
      <div class="welcome-slot">
        <h2 class="welcome-title">Welcome<span class="welcome-period">.</span></h2>
        <p class="welcome-subspace" role="status" aria-live="polite">Entered details are incorrect.</p>
      </div>

      <div class="field credential-field">
        <label for="mobile-number">Mobile number</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M10 17h4"/></svg>
          <input id="mobile-number" name="mobile" type="tel" inputmode="numeric" autocomplete="tel" placeholder="Enter mobile number" required>
        </div>
      </div>

      <div class="field credential-field">
        <label for="password">Password</label>
        <div class="input-wrap password-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
            <svg class="eye-visible" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            <svg class="eye-hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6 0 9.5 6 9.5 6a17 17 0 0 1-2.2 2.8M6.2 6.2C3.8 7.8 2.5 12 2.5 12s3.5 6 9.5 6a9.8 9.8 0 0 0 3.1-.5M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </div>

      <button class="forgot-password" type="button"><span>Forgot password?</span></button>
      <button class="login-button" type="submit">
        <span>Sign In</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <p class="login-note">Your photos are private and accessible only with the details provided to you.</p>
      <section class="recovery-panel" aria-labelledby="recovery-message">
        <div class="recovery-emoji" role="button" tabindex="0" aria-label="Change emoji temporarily">
          <picture class="emoji-neutral">
            <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f610/512.webp" type="image/webp">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f610/512.gif" alt="Neutral face">
          </picture>
          <picture class="emoji-dizzy">
            <source srcset="https://fonts.gstatic.com/s/e/notoemoji/latest/1f635/512.webp" type="image/webp">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f635/512.gif" alt="Dizzy face">
          </picture>
        </div>
        <div class="recovery-card">
          <button class="recovery-back-icon" type="button" aria-label="Back to sign in">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h11"/></svg>
          </button>
          <p id="recovery-message">If you have lost your credentials,<strong>Contact your photographer.</strong></p>
          <div class="recovery-stars" aria-hidden="true">******</div>
          <button class="recovery-back-link" type="button">Back to Sign in</button>
        </div>
      </section>
      </form>
    </div>
    <div class="powered-by">
      <span>Powered by</span>
      <a href="https://pixelsetu.com" target="_blank" rel="noopener noreferrer" aria-label="Visit PixelSetu">
        <img src="https://ik.imagekit.io/d3ycnoiwd/PrantikWebsite/PixelSetu-low.png" alt="PixelSetu">
      </a>
    </div>
  </main>

  <script>
    document.addEventListener("contextmenu", event => {
      if (!event.target.closest("input")) event.preventDefault();
    });

    const loginForm = document.querySelector("#login-form");
    const recoveryPanel = document.querySelector(".recovery-panel");
    const recoveryCard = document.querySelector(".recovery-card");
    const recoveryBackButtons = document.querySelectorAll(".recovery-back-icon, .recovery-back-link");

    document.querySelector(".forgot-password").addEventListener("click", () => {
      restoreDesignatedEmoji(document.querySelector(".welcome-emoji"));
      loginForm.style.setProperty("--login-card-fixed-height", `${loginForm.offsetHeight}px`);
      loginForm.classList.add("recovery-mode");
      restoreDesignatedEmoji(document.querySelector(".recovery-emoji"));
      document.dispatchEvent(new CustomEvent("login:forgot-password"));
    });

    recoveryBackButtons.forEach(button => {
      button.addEventListener("click", () => {
        if (recoveryPanel.classList.contains("recovery-leaving")) return;
        const recoveryEmoji = document.querySelector(".recovery-emoji");
        cancelTemporaryEmoji(recoveryEmoji);
        restoreDesignatedEmoji(document.querySelector(".welcome-emoji"));
        recoveryPanel.classList.add("recovery-leaving");
        recoveryCard.addEventListener("animationend", event => {
          if (event.animationName !== "recovery-out") return;
          recoveryPanel.classList.remove("recovery-leaving");
          loginForm.classList.remove("recovery-mode");
          restoreDesignatedEmoji(recoveryEmoji, false);
          loginForm.classList.add("returning-to-login");
          loginForm.style.removeProperty("--login-card-fixed-height");
          window.setTimeout(() => loginForm.classList.remove("returning-to-login"), 340);
        }, { once: true });
      });
    });

    const passwordInput = document.querySelector("#password");
    const passwordToggle = document.querySelector(".password-toggle");
    const passwordWrap = document.querySelector(".password-wrap");
    const mobileInput = document.querySelector("#mobile-number");
    const welcomeEmoji = document.querySelector(".welcome-emoji");
    const loginStatus = document.querySelector(".welcome-subspace");
    const emojiRestoreTimers = new WeakMap();
    const isMobileLoginView = () => window.matchMedia("(max-width: 899px)").matches;
    let passwordScrollTimer;
    let passwordScrollLock;
    let passwordScrollCorrectionPending = false;

    function showEmojiDuringPasswordFocus() {
      if (!isMobileLoginView() || document.activeElement !== passwordInput) return;
      const emojiTop = welcomeEmoji.getBoundingClientRect().top;
      const correction = emojiTop - 120;
      if (Math.abs(correction) > 1) {
        window.scrollBy({ top: correction, left: 0, behavior: "auto" });
      }
    }

    passwordInput.addEventListener("focus", () => {
      if (!isMobileLoginView()) return;
      window.clearTimeout(passwordScrollTimer);
      window.clearInterval(passwordScrollLock);
      requestAnimationFrame(showEmojiDuringPasswordFocus);
      window.setTimeout(showEmojiDuringPasswordFocus, 120);
      window.setTimeout(showEmojiDuringPasswordFocus, 350);
      passwordScrollLock = window.setInterval(showEmojiDuringPasswordFocus, 80);
      passwordScrollTimer = window.setTimeout(() => {
        window.clearInterval(passwordScrollLock);
        showEmojiDuringPasswordFocus();
      }, 1600);
    });

    passwordInput.addEventListener("blur", () => {
      window.clearInterval(passwordScrollLock);
      window.clearTimeout(passwordScrollTimer);
    });

    window.visualViewport?.addEventListener("resize", () => {
      if (document.activeElement !== passwordInput || !isMobileLoginView()) return;
      window.clearTimeout(passwordScrollTimer);
      passwordScrollTimer = window.setTimeout(showEmojiDuringPasswordFocus, 180);
    });

    const maintainPasswordEmojiPosition = () => {
      if (!isMobileLoginView() || document.activeElement !== passwordInput || passwordScrollCorrectionPending) return;
      passwordScrollCorrectionPending = true;
      requestAnimationFrame(() => {
        passwordScrollCorrectionPending = false;
        showEmojiDuringPasswordFocus();
      });
    };

    window.addEventListener("scroll", maintainPasswordEmojiPosition, { passive: true });
    window.visualViewport?.addEventListener("scroll", maintainPasswordEmojiPosition, { passive: true });

    function animateEmojiChange(emoji) {
      if (!emoji) return;
      emoji.classList.remove("is-changing");
      void emoji.offsetWidth;
      emoji.classList.add("is-changing");
    }

    function cancelTemporaryEmoji(emoji) {
      if (!emoji) return;
      const existingTimer = emojiRestoreTimers.get(emoji);
      if (existingTimer) window.clearTimeout(existingTimer);
      emojiRestoreTimers.delete(emoji);
      emoji.classList.remove("is-changing");
    }

    function restoreDesignatedEmoji(emoji, shouldAnimate = true) {
      if (!emoji) return;
      cancelTemporaryEmoji(emoji);
      emoji.classList.remove("is-dizzy");
      if (shouldAnimate) animateEmojiChange(emoji);
    }

    document.querySelectorAll(".welcome-emoji, .recovery-emoji").forEach(emoji => {
      const showTemporaryDizzyEmoji = () => {
        const existingTimer = emojiRestoreTimers.get(emoji);
        if (existingTimer) window.clearTimeout(existingTimer);
        emoji.classList.add("is-dizzy");
        animateEmojiChange(emoji);
        emojiRestoreTimers.set(emoji, window.setTimeout(() => {
          emoji.classList.remove("is-dizzy");
          animateEmojiChange(emoji);
          emojiRestoreTimers.delete(emoji);
        }, 5000));
      };

      emoji.addEventListener("animationend", event => {
        if (event.animationName === "emoji-change-scale" ||
            event.animationName === "recovery-emoji-change-scale") {
          emoji.classList.remove("is-changing");
        }
      });

      emoji.addEventListener("click", showTemporaryDizzyEmoji);
      emoji.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.code !== "Space") return;
        event.preventDefault();
        showTemporaryDizzyEmoji();
      });
    });

    passwordWrap.addEventListener("focusin", () => {
      restoreDesignatedEmoji(welcomeEmoji);
      welcomeEmoji.classList.add("is-password-active");
    });

    mobileInput.addEventListener("focus", () => {
      restoreDesignatedEmoji(welcomeEmoji);
    });

    passwordWrap.addEventListener("focusout", () => {
      requestAnimationFrame(() => {
        if (!passwordWrap.contains(document.activeElement)) {
          restoreDesignatedEmoji(welcomeEmoji);
          welcomeEmoji.classList.remove("is-password-active");
        }
      });
    });

    passwordToggle.addEventListener("click", () => {
      restoreDesignatedEmoji(welcomeEmoji);
      const shouldShow = passwordInput.type === "password";
      passwordInput.type = shouldShow ? "text" : "password";
      passwordToggle.setAttribute("aria-pressed", String(shouldShow));
      passwordToggle.setAttribute("aria-label", shouldShow ? "Hide password" : "Show password");
    });

    [mobileInput, passwordInput].forEach(input => {
      input.addEventListener("input", () => {
        restoreDesignatedEmoji(welcomeEmoji);
        welcomeEmoji.classList.remove("is-login-error");
        loginStatus.classList.remove("is-error");
        loginForm.classList.remove("has-login-error");
        loginForm.style.removeProperty("--login-card-error-height");
        mobileInput.removeAttribute("aria-invalid");
        passwordInput.removeAttribute("aria-invalid");
      });
    });

    loginForm.addEventListener("submit", event => {
      event.preventDefault();
      const credentialsAreValid = mobileInput.value.trim() === "1234" && passwordInput.value === "1234";
      if (!credentialsAreValid) {
        loginForm.style.setProperty("--login-card-error-height", `${loginForm.offsetHeight}px`);
        restoreDesignatedEmoji(welcomeEmoji);
        welcomeEmoji.classList.add("is-login-error");
        loginStatus.classList.add("is-error");
        loginForm.classList.add("has-login-error");
        mobileInput.setAttribute("aria-invalid", "true");
        passwordInput.setAttribute("aria-invalid", "true");
        return;
      }

      window.location.href = "index.html";
    });
  </script>
</body>
</html>
